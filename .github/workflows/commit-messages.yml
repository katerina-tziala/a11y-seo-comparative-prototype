name: Check commit messages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commit-messages:
    if: github.event_name == 'pull_request' || github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate every new commit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          commits_file="${RUNNER_TEMP}/commit-message-commits"
          message_file="${RUNNER_TEMP}/commit-message"

          if [[ -n "${BASE_SHA}" && ! "${BASE_SHA}" =~ ^0+$ ]]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "${BASE_SHA}"
            fi
            git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}" > "${commits_file}"
          else
            # New branch: exclude history already reachable from other branches.
            pushed_ref="refs/remotes/origin/${GITHUB_REF#refs/heads/}"
            exclude_refs=()
            while IFS= read -r ref; do
              if [[ "${ref}" != "${pushed_ref}" && "${ref}" != refs/remotes/origin/HEAD ]]; then
                exclude_refs+=("${ref}")
              fi
            done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)
            git rev-list --reverse "${HEAD_SHA}" --not "${exclude_refs[@]}" > "${commits_file}"
          fi

          failed=0
          while IFS= read -r commit; do
            git show -s --format=%B "${commit}" > "${message_file}"
            # Shared hook rule: a11y scopes must be AR01 through AR48.
            if ! sh .githooks/commit-msg "${message_file}"; then
              printf 'Invalid commit: %s\n' "${commit}"
              git show -s --format=%s "${commit}"
              failed=1
            fi
          done < "${commits_file}"

          exit "${failed}"
