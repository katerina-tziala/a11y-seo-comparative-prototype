name: Deploy research prototypes to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - prototype-scaffold
      - main
      - accessibility-governed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  # Add future research branch/path mappings here.
  DEPLOYMENTS: |
    prototype-scaffold scaffold
    main baseline
    accessibility-governed accessibility-governed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Fetch latest deployment branches
        run: git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Build isolated branch artifacts
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          worktrees_dir="${RUNNER_TEMP}/research-worktrees"
          staging_dir="${RUNNER_TEMP}/pages"
          mkdir -p "${worktrees_dir}" "${staging_dir}"

          while read -r branch target_dir; do
            if [[ -z "${branch}" ]]; then
              continue
            fi

            remote_ref="refs/remotes/origin/${branch}"
            if ! git show-ref --verify --quiet "${remote_ref}"; then
              echo "Skipping ${branch}: remote branch does not exist."
              continue
            fi

            worktree="${worktrees_dir}/${target_dir}"
            git worktree add --detach "${worktree}" "origin/${branch}"

            if [[ ! -f "${worktree}/package.json" ]]; then
              echo "Skipping ${branch}: branch does not contain an initialised Node/Nuxt project."
              git worktree remove "${worktree}"
              continue
            fi

            echo "Building ${branch} at /${REPOSITORY_NAME}/${target_dir}/"
            (
              cd "${worktree}"
              npm ci
              NITRO_PRESET=github_pages \
                NUXT_APP_BASE_URL="/${REPOSITORY_NAME}/${target_dir}/" \
                npm run generate
              test -f .output/public/index.html
            )

            mkdir -p "${staging_dir}/${target_dir}"
            cp -a "${worktree}/.output/public/." "${staging_dir}/${target_dir}/"
            git worktree remove --force "${worktree}"
          done <<< "${DEPLOYMENTS}"

          if ! find "${staging_dir}" -mindepth 2 -name index.html -print -quit | grep -q .; then
            echo "No deployable branch produced an index.html file." >&2
            exit 1
          fi

          echo "Combined Pages artifact:"
          find "${staging_dir}" -mindepth 1 -maxdepth 2 -type d -print

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
